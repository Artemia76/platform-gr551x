; Exemple minimal : LED + console BLE (« T1000A-Arduino »).
;   pio run                 → .pio/build/t1000-a/firmware_dfu.bin
;   pio run -t upload       → téléversement par le DFU BLE du bootloader (paquet Python « bleak »)

[platformio]
; Fichier facultatif, non versionné : surcharge locale (ex. SDK en cours de développement).
extra_configs = local.ini

[env:t1000-a]
platform = symlink://../..
board = t1000-a
framework = arduino
custom_upload_enter_dfu = T1000A-Arduino
